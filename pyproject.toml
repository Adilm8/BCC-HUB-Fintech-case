[project]
name = "requirements-validator-agent"
version = "0.1.0"
description = "Агент статической проверки требований по ISO/IEC/IEEE 29148 и IEEE 830"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "google-genai>=1.0",
    "pydantic>=2.6",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
