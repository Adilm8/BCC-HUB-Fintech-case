questions:
  - id: Q-001
    blocking: true
    finding_ids:
      - S-001
    requirement_ids:
      - R-017
      - R-007
    section: "Часть A. Новый функционал › Критерии приемки"
    quotes:
      - "Покупка 31 января в 23:58 на 4 000 ₸ | Провести 1 февраля в 00:03 по Алматы | Февральский счётчик вырос на 4 000 ₸"
      - "Месяц определяется по дате совершения покупки в Алматы. В расходы входят проведённые покупки"
    text: "По какой дате операция относится к месячному счётчику: по дате совершения или по дате проведения в процессинге?"
    options:
      - "По дате совершения покупки (исправить R-017 на январский счётчик)"
      - "По дате проведения покупки (исправить R-007 в части определения месяца)"
    option_consequences:
      - "Критерий приёмки R-017 изменяется: покупка 31 января относиться к январю"
      - "Требование Ф-2 в R-007 переписывается на учет по дате проведения в процессинге"
    answer: "Операция относится к месячному счётчику по дате совершения покупки в часовом поясе Алматы (UTC+5). Исправляем критерий приёмки R-017: покупка 31 января в 23:58, проведённая 1 февраля, учитывается в январском счётчике на 4 000 ₸."
  - id: Q-002
    blocking: true
    finding_ids:
      - S-002
    requirement_ids:
      - R-008
      - R-009
    section: "Часть A. Новый функционал › Требования к изменениям › Функциональные требования"
    quotes:
      - "На карту приходится максимум один такой push за календарный месяц"
      - "Если она ниже нового порога, следующее достижение вызывает push независимо от истории предыдущей настройки"
    text: "Отправлять ли повторное push-уведомление в одном и том же календарном месяце, если клиент изменил порог на более высокий и снова достиг его?"
    options:
      - "Да, изменение порога сбрасывает ограничение, и при достижении нового порога push отправляется."
      - "Нет, лимит в 1 push на календарный месяц является абсолютным независимо от изменений порога."
    option_consequences:
      - "В R-008 необходимо добавить оговорку о сбросе лимита при изменении порога, логика сервиса push разрешит повторную отправку."
      - "В R-009 необходимо уточнить, что push при новом пороге отправляется только в следующем месяце или если в текущем месяце push ещё не отправлялся."
    answer: "Да, изменение значения порога сбрасывает ограничение в текущем календарном месяце, и при достижении нового порога push отправляется повторно. В требование R-008 добавляем уточнение, что лимит «1 push в месяц» действует при неизменном пороге."
  - id: Q-003
    blocking: true
    finding_ids:
      - S-004
    requirement_ids:
