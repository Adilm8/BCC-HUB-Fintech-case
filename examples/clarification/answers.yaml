      - R-036
    section: "Часть B. REST API › Статусы"
    quotes:
      - "400. Ответ в случае, если параметры запроса заполнены неверно"
      - "{\"result\":\"ERROR\",\"message\":\"Проверьте сумму\"}"
    text: "Какой HTTP-код ответа должен возвращать сервис при ошибке валидации параметров (например, неверная сумма порога)?"
    options:
      - "Возвращать HTTP status 400 Bad Request с объектом ошибки."
      - "Возвращать HTTP status 200 OK с результатом result=ERROR в теле ответа."
    option_consequences:
      - "Удалить пример с ERROR из секции 200, в секцию 400 добавить структуру ошибки с полем message."
      - "Изменить описание статуса 400 в R-035 и зафиксировать формат 200 OK для ошибок валидации."
    answer: "При ошибке валидации параметров сервис возвращает HTTP status 400 Bad Request с телом {\"result\":\"ERROR\",\"message\":\"Проверьте сумму\"}. Пример с ошибкой из секции 200 OK удаляем и переносим структуру ошибки в описание статуса 400."
