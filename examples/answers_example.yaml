# Пример заполненного файла ответов автора ТЗ по документу docs/requirements.md.
#
# ВАЖНО: идентификаторы вопросов (Q-001, …) и их порядок меняются от прогона к прогону.
# Не используйте этот файл напрямую как готовые ответы к произвольному отчёту —
# перед повторной проверкой обязательно перегенерируйте шаблон из текущего отчёта командой:
#   python -m validator --questions-template reports/before.json answers.yaml
# Заполните поле `answer:` в сгенерированном `answers.yaml` (сохраняя поле `text:`),
# затем запустите повторную проверку:
#   python -m validator docs/requirements.md reports/after.md --previous reports/before.json --answers answers.yaml
#
# При загрузке каждый ответ сверяется с вопросами из `--previous` по ID и тексту вопроса (`text`).
# Если ID в новом отчёте сместился, ответ сопоставляется по сходству текста вопроса;
# ответы без подходящего вопроса в `--previous` выводятся в предупреждениях и игнорируются.
document: "Уведомление о расходах по карте"
questions:
  - id: Q-001
    blocking: true
    finding_ids:
      - S-001
    section: "Часть A. Новый функционал › Требования к изменениям › Функциональные требования"
    quotes:
      - "На карту приходится максимум один такой push за календарный месяц."
      - "Если она ниже нового порога, следующее достижение вызывает push независимо от истории предыдущей настройки."
    text: "Какое правило приоритетно при изменении порога в текущем месяце: не более одного push в месяц (Ф-3) или повторный push после смены порога (Ф-4)?"
    options:
      - "Не более одного push в календарный месяц (Ф-3); смена порога не сбрасывает признак отправки"
      - "После повышения порога возможен новый push в том же месяце (Ф-4)"
    answer: "Приоритет у Ф-3: на одну карту отправляется максимум один push за календарный месяц. Смена порога не сбрасывает признак отправки в текущем месяце; правило Ф-4 скорректируем."

  - id: Q-002
    blocking: true
    finding_ids:
      - S-002
    section: "Часть A. Новый функционал › Критерии приемки"
    quotes:
      - "Месяц определяется по дате совершения покупки в Алматы."
      - "Покупка 31 января в 23:58 на 4 000 ₸ | Провести 1 февраля в 00:03 по Алматы | Февральский счётчик вырос на 4 000 ₸"
    text: "К какому месяцу относится покупка, совершённая 31 января и проведённая 1 февраля: по дате совершения (Ф-2) или по дате проведения (критерий приёмки)?"
    options:
      - "По дате совершения покупки по времени Алматы (Ф-2); исправить критерий приёмки на январский счётчик"
      - "По дате проведения (клиринга) операции; исправить Ф-2"
    answer: "Месяц всегда определяется по дате совершения покупки по времени Алматы (UTC+5), как в Ф-2. Вторую строку критериев приёмки исправим: покупка 31 января 23:58 увеличивает январский счётчик на 4 000 ₸."

  - id: Q-003
    blocking: true
    finding_ids:
      - S-003
    section: "Часть B. REST API › Общие параметры"
    quotes:
      - "Description | Сохранение порога. Функциональные требования: чтение порога"
      - "Приложение читает и сохраняет настройки через дочерний документ «Уведомление о расходах по карте — REST API»."
    text: "Какой метод API мобильное приложение использует для чтения текущего порога и накопленных расходов за месяц?"
    options:
      - "Добавить отдельный GET-метод чтения настройки и суммы за месяц"
      - "Возвращать текущую настройку только в ответе метода сохранения"
    answer: "Разделяем операции: добавим отдельный метод GET /alerts/limit?cardId=... для чтения текущей настройки (порог, признак enabled) и суммы расходов за текущий месяц, а описание метода сохранения очистим от упоминания чтения."

  - id: Q-004
    blocking: true
    finding_ids:
      - S-004
    section: "Часть B. REST API › Общие параметры"
    quotes:
      - "REST type | GET"
      - "Заменить настройку и вернуть результат сохранения."
    text: "Какой HTTP-метод должен использоваться вместо GET для сохранения порога и как передавать параметры?"
    options:
      - "Изменение выполняется методом POST или PUT с параметрами в теле запроса"
      - "Оставить GET и обосновать, почему изменение состояния допустимо"
    answer: "Заменяем метод сохранения на PUT /alerts/limit с передачей cardId, amount и enabled в JSON-теле запроса (Content-Type: application/json); в query-строке параметры не передаются."

  - id: Q-005
    blocking: true
    finding_ids:
      - S-005
    section: "Часть B. REST API › Статусы"
    quotes:
      - "200. Successful — Created"
      - "{\"result\":\"ERROR\",\"message\":\"Проверьте сумму\"}"
      - "400. Ответ в случае, если параметры запроса заполнены неверно."
    text: "Какой HTTP-статус возвращается при ошибке валидации суммы — 200 с result=ERROR или 400 — и какой статус корректен для успешного ответа?"
    options:
      - "Ошибка возвращается с кодом 400 и единым телом ошибки; успех — 200 OK"
      - "Ошибка возвращается с кодом 200 и result=ERROR; обновить перечень статусов"
    answer: "При ошибке валидации возвращаем HTTP 400 с единым форматом тела ошибки {\"code\":\"VALIDATION_ERROR\",\"message\":\"...\"}. Успешное сохранение возвращает HTTP 200 OK (исправим заголовок с Created на OK и уберём пример ERROR из раздела 200)."

  - id: Q-006
    blocking: true
    finding_ids:
      - S-006
    section: "Часть B. REST API › Статусы"
    quotes:
      - "403. Unsuccessful — Forbidden"
      - "Для чужой карты возвращается 404, как и для отсутствующей карты."
    text: "Какой HTTP-статус возвращается при обращении к чужой карте — 403 Forbidden или 404 Not Found?"
    options:
      - "Возвращать 403 для чужой карты и 404 для отсутствующей, оба кода добавить в перечень"
      - "Возвращать 404 для чужой и отсутствующей карты, добавить 404 в перечень и убрать 403 из этого сценария"
    answer: "Для чужой и отсутствующей карты возвращаем единый HTTP 404 (чтобы не раскрывать существование чужих карт). Код 404 добавим в перечень статусов, а 403 оставим только для запрета по правам/роли."

  - id: Q-007
    blocking: false
    finding_ids:
      - S-007
    section: "Часть B. REST API › Ответ"
    quotes:
      - "amount | integer | 32 bit | Да | 1 000–1 000 000 | Порог в тенге | limit_kzt"
      - "amount | string | При успехе | Порог в тенге | limit_kzt"
    text: "Какой единый тип данных должен использоваться для полей amount и enabled в запросе и ответе?"
    options:
      - "Привести поля к integer (amount) и boolean/integer (enabled) в запросе и ответе"
      - "Оставить строковый формат в ответе и задокументировать преобразование"
    answer: "Приводим типы к единому формату в запросе и ответе: amount — integer (целое число в тенге), enabled — boolean (true/false)."

  - id: Q-008
    blocking: false
    finding_ids:
      - D-001
    section: "Часть A. Новый функционал › Требования к данным"
    quotes:
      - "Хранить идентификатор карты, месяц, идентификатор операции, сумму покупки в тиынах, признак отправки и порог в тенге."
    text: "В каких единицах хранятся и сравниваются суммы покупок и порог (тиыны или тенге) и каково правило пересчёта?"
    options:
      - "Хранить и сравнивать все суммы в тиынах, переводя порог умножением на 100"
      - "Хранить всё в тенге с правилом округления дробных сумм"
    answer: "Суммы покупок и накопленный итог за месяц хранятся в тиынах; при сравнении порог в тенге умножается на 100 (1 ₸ = 100 тиынов), округление не требуется."

  - id: Q-009
    blocking: false
    finding_ids:
      - D-002
    section: "Часть B. REST API › Параметры запроса"
    quotes:
      - "amount | integer | 32 bit | Да | 1 000–1 000 000 | Порог в тенге | limit_kzt"
      - "enabled | integer | 1 знак | Да | 0 или 1 | Признак включения | enabled"
    text: "Обязателен ли параметр amount и проверяется ли его диапазон, когда уведомление выключается (enabled=false / 0)?"
    options:
      - "При выключении уведомления параметр amount необязателен и не валидируется"
      - "Параметр amount обязателен всегда с проверкой диапазона"
    answer: "При выключении уведомления (enabled=false) параметр amount необязателен и не валидируется; ранее сохранённый порог остаётся в БД для повторного включения."

  - id: Q-010
    blocking: false
    finding_ids:
      - D-003
    section: "Часть A. Новый функционал › Требования к интеграции"
    quotes:
      - "Повторная доставка одного события процессинга сохраняет исходный итог."
    text: "По какому ключу и в течение какого окна выполняется дедупликация повторных событий процессинга?"
    options:
      - "Дедупликация по operation_id с фиксированным окном хранения"
      - "Повторная доставка невозможна по контракту источника"
    answer: "Дедупликация выполняется по уникальному идентификатору операции процессинга (operation_id); окно хранения ключей — 35 календарных дней, чтобы покрыть месяц и поздние возвраты."

  - id: Q-011
    blocking: false
