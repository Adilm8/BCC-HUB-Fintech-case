      - "99% событий при пиковой нагрузке"
    answer: "95% событий передаются в сервис push не позднее 60 секунд с момента получения события сервисом расходов при штатной нагрузке до 200 событий/с."

  - id: Q-012
    blocking: false
    finding_ids:
      - D-005
    section: "Часть A. Новый функционал › Дизайн процесса UI"
    quotes:
      - "По умолчанию уведомление выключено."
      - "На экране видны переключатель, поле «Порог, ₸», сумма за месяц и кнопка «Сохранить»."
    text: "Какое значение порога показывается при первом включении и отправляется ли push, если расходы уже превысили новый порог?"
    options:
      - "Поле порога пустое (обязателен ввод); ретроспективный push не отправляется"
      - "Подставляется значение по умолчанию; при превышении сразу отправляется push"
    answer: "При первом включении поле «Порог, ₸» пустое и требует ввода от 1 000 до 1 000 000 ₸. Если текущие расходы за месяц уже равны или выше нового порога, ретроспективный push сразу не отправляется."

