# Доменный профиль «банк / финтех»: типовые места, которые в ТЗ часто остаются неопределёнными.
# Подсказки для проверки, а не нарушения: находка возможна только с цитатой из документа.
domain: banking
detect_keywords: [карт, платеж, перевод, счет, транзакц, процессинг, депозит, вклад, кредит, займ, ипотек, баланс, остаток, комисс, лимит, валют, конвертац, курс, выписк, проводк, клиринг, авторизац, холд, чарджбэк, возврат, рефанд, кэшбэк, тариф, овердрафт, эквайринг, эмитент, держател, тенге, рубл, банкомат, терминал, kyc, aml, iban, swift, pan, cvv, mcc, 3ds, push]
items:
  - id: B01
    topic: Авторизация и блокировка средств
    applies_when: Требование описывает карточные операции, списания, резервирование средств или расчёт доступного остатка.
    check: Определено ли, как операция влияет на доступный и бухгалтерский баланс на этапе авторизации и как обрабатывается истечение срока удержания средств?
    typical_gap: Авторизация и фактическое списание отождествляются, а поведение при непоступлении подтверждающего расчётного сообщения не описано.
    criterion: complete
  - id: B02
    topic: Клиринг и окончательное списание
    applies_when: Требование затрагивает финальные расчёты по операциям, учёт проводок, выписки или расчёт бонусов и комиссий.
    check: Указано ли, как обрабатывается расхождение между суммой авторизации и суммой клиринга, включая клиринг без предварительной авторизации?
    typical_gap: Предполагается точное совпадение суммы удержания и итогового списания, без правил корректировки баланса и возможного технического перерасхода.
    criterion: complete
  - id: B03
    topic: Дата операции и дата проводки
    applies_when: Требование касается выписок, истории операций, начисления процентов, лимитов или отчётных периодов.
    check: Разграничено ли использование даты совершения операции и даты её отражения по счёту для расчётов, фильтрации и отображения?
    typical_gap: В тексте используется обобщённое понятие даты операции, из-за чего неясно, к какому периоду относить расчёты на стыке дней или месяцев.
    criterion: unambiguous
  - id: B04
    topic: Операции в ожидании и отклонённые операции
    applies_when: Требование описывает историю операций, расчёт баланса, уведомления или учёт лимитов.
    check: Определено ли, отображаются ли операции в статусе ожидания и отклонённые операции, влияют ли они на лимиты и уведомляют ли о них клиента?
    typical_gap: Описан только успешный поток, а судьба незавершённых и отклонённых операций в интерфейсе, выписке и счётчиках остаётся неопределённой.
    criterion: set_complete
  - id: B05
    topic: Полная и частичная отмена авторизации
    applies_when: Требование касается карточных транзакций, удержаний, возврата заблокированных средств или пересчёта лимитов.
    check: Задано ли поведение системы при полной и частичной отмене авторизации, включая пересчёт доступного остатка, лимитов и отправку уведомлений?
    typical_gap: Частичная отмена удержания не рассматривается либо не уточняется, восстанавливается ли при этом израсходованный лимит.
    criterion: complete
  - id: B06
    topic: Возврат средств по операции
    applies_when: Требование охватывает возврат платежа или покупки, частичный возврат, корректировку начислений или расчёт лимитов.
    check: Определены ли правила для полного и частичного возврата средств, включая валюту, курс, возврат комиссии и корректировку ранее начисленных вознаграждений?
    typical_gap: Не указано, возвращается ли комиссия и как учитывается возврат в лимитах, статистике расходов и программах лояльности.
    criterion: set_complete
  - id: B07
    topic: Оспаривание операций и аннулирование
    applies_when: Требование описывает жизненный цикл платежей, претензионную работу или корректирующие проводки.
    check: Описано ли влияние диспутных процедур и аннулирования операций на баланс, статус транзакции, спорные удержания и уведомления клиента?
    typical_gap: Оспаривание операций и повторное представление списания не включены в модель состояний транзакции.
    criterion: set_complete
  - id: B08
    topic: Валюта операции и валюта счёта
    applies_when: Требование включает денежные суммы, трансграничные операции, переводы, лимиты или отображение транзакций.
    check: Однозначно ли указано, в какой валюте задаются, рассчитываются, хранятся и отображаются суммы — в валюте операции, валюте счёта или базовой валюте?
    typical_gap: Упомянута сумма без привязки к валюте, что вызывает разночтения при мультивалютных и трансграничных операциях.
    criterion: unambiguous
  - id: B09
    topic: Источник и момент фиксации курса конвертации
    applies_when: Требование допускает несовпадение валюты операции, счёта, карты или лимита.
    check: Заданы ли источник курса обмена, тип курса и точный момент его фиксации при расчёте суммы списания, возврата и проверке лимитов?
    typical_gap: Указана необходимость конвертации по курсу банка, но не определено, какой именно курс применяется и на момент авторизации или клиринга он фиксируется.
    criterion: unambiguous
  - id: B10
    topic: Включение комиссий и сборов в расчёты
    applies_when: Требование описывает платежи, переводы, лимиты, проверку достаточности средств или информирование клиента.
    check: Уточнено ли, включаются ли комиссии и сборы в проверяемые лимиты, минимальные и максимальные суммы, а также отображаются ли они отдельно от тела операции?
    typical_gap: Непонятно, применяется ли лимит к сумме перевода с учётом комиссии или без неё, и кто несёт расходы при отказе или возврате.
    criterion: unambiguous
  - id: B11
    topic: Округление и минимальные денежные единицы
    applies_when: Требование содержит расчёты процентов, комиссий, конвертации, кэшбэка или передачу денежных сумм.
    check: Определены ли правила округления, точность промежуточных и итоговых расчётов, а также формат представления сумм с учётом минимальных единиц валюты?
    typical_gap: Метод округления и обработка валют с разным числом дробных знаков не указаны, что приводит к расхождениям между системами.
    criterion: unambiguous
  - id: B12
    topic: Нулевые и отрицательные суммы
    applies_when: Требование описывает ввод, приём, обработку или отображение финансовых операций и корректировок.
    check: Определено ли поведение для нулевых сумм (например, проверочных авторизаций) и отрицательных значений при расчётах, валидации, уведомлениях и отчётах?
    typical_gap: Требования неявно предполагают строго положительные суммы и не описывают реакцию на нулевые проверочные операции или сторнирующие записи.
    criterion: complete
  - id: B13
    topic: Ограничения и периоды расчёта лимитов
    applies_when: Требование задаёт ограничения на суммы или количество операций за операцию, день, неделю или месяц.
    check: Уточнено ли, рассчитывается ли период лимита как календарный или скользящий, включаются ли граничные значения и по каким типам операций ведётся подсчёт?
    typical_gap: Не указано, сбрасывается ли дневной или месячный лимит в начале календарного периода либо считается за скользящее окно, а также включается ли сама граница.
    criterion: unambiguous
  - id: B14
    topic: Субъект применения лимита
    applies_when: Требование описывает лимиты, тарифы или ограничения при наличии нескольких карт, счетов или каналов.
    check: Определено ли, на какой уровень распространяется ограничение — на отдельную карту, на счёт, на клиента в целом или на конкретный канал обслуживания?
    typical_gap: Неясно, суммируются ли операции по основной и дополнительным картам либо по разным счетам одного клиента в рамках одного лимита.
    criterion: set_consistent
  - id: B15
    topic: Часовой пояс расчётов и отображения
    applies_when: Требование содержит даты, время, суточные лимиты, расписания, уведомления или историю операций.
    check: Задано ли, какой часовой пояс применяется для расчёта бизнес-правил и границ периодов, а какой — для отображения клиенту?
    typical_gap: Время указано без часового пояса, из-за чего неясно, использовать ли время сервера, центрального офиса банка или устройства клиента.
    criterion: unambiguous
  - id: B16
    topic: Границы календарных периодов
    applies_when: Требование опирается на конец дня, месяца или года, графики платежей, начисление процентов или сброс счётчиков.
    check: Определены ли правила обработки границ суток, месяцев разной длины, високосных годов и операций, попадающих точно на границу периода?
    typical_gap: Не описано поведение регулярных платежей, начислений или расчётных дат при отсутствии соответствующего числа в коротком месяце.
    criterion: complete
  - id: B17
    topic: Операционный день, время отсечки и праздничные дни
    applies_when: Требование касается межбанковских переводов, погашения кредитов, зачислений, начислений по вкладам или регламентных обработок.
    check: Указаны ли правила обработки операций после времени отсечки операционного дня, а также в выходные и официальные праздничные дни?
    typical_gap: Не определено, переносится ли дата исполнения и дата валютирования на следующий рабочий день и как об этом информируется клиент.
    criterion: complete
  - id: B18
    topic: Момент вступления изменений настроек в силу
    applies_when: Требование описывает изменение лимитов, тарифов, ставок, прав доступа или пользовательских настроек.
    check: Определено ли, применяются ли изменённые параметры немедленно, со следующего расчётного периода или только к новым операциям, не затрагивая уже находящиеся в обработке?
    typical_gap: Не указано, влияет ли изменение лимита или настройки уведомлений на транзакции, авторизованные до момента изменения.
    criterion: unambiguous
  - id: B19
    topic: Статусная модель карты, счёта и клиента
    applies_when: Требование описывает операции, настройки, просмотр данных или уведомления по картам, счетам и профилю клиента.
    check: Задано ли допустимое поведение для всех статусов карты, счёта и клиента (активный, временно заблокированный, постоянно заблокированный, просроченный, закрытый, арестованный)?
    typical_gap: Рассмотрен только активный статус, а обработка клиринга, возвратов, зачислений и уведомлений для заблокированных или закрытых продуктов не описана.
    criterion: set_complete
  - id: B20
    topic: Перевыпуск карты и преемственность данных
    applies_when: Требование касается карточных настроек, лимитов, токенов, истории операций, подписок или уведомлений.
    check: Определено ли, переносятся ли лимиты, настройки уведомлений, история операций и привязки при плановом и внеплановом перевыпуске карты?
    typical_gap: Неясно, сохраняются ли установленные клиентом ограничения и видна ли история операций по старой карте после перевыпуска.
    criterion: set_complete
  - id: B21
    topic: Мультивалютные счета и карты
    applies_when: Требование описывает списания, пополнения, балансы, выписки или лимиты по продуктам с несколькими валютами.
    check: Задан ли порядок выбора валютного счёта при списании и зачислении, а также правила автоматической конвертации при недостатке средств в валюте операции?
    typical_gap: Не определена приоритетность счетов списания и допустимость составного списания с нескольких валютных счетов одновременно.
    criterion: complete
  - id: B22
    topic: Дополнительные карты и разделение ролей
    applies_when: Требование касается карточных продуктов, прав управления, лимитов, выписок или уведомлений.
    check: Разграничены ли права, лимиты, видимость истории и получатели уведомлений для владельца счёта и держателя дополнительной карты?
    typical_gap: Владелец счёта и держатель карты рассматриваются как одно лицо, что нарушает приватность или логику управления лимитами.
    criterion: set_consistent
  - id: B23
    topic: Ключи идемпотентности и окно дедупликации
    applies_when: Требование описывает платёжные API, создание операций, изменение настроек или приём команд.
    check: Определены ли механизм обеспечения идемпотентности, длительность окна дедупликации и реакция системы на повторный запрос с тем же ключом, но другими параметрами?
    typical_gap: Упомянута необходимость идемпотентности без указания срока хранения ключа, возвращаемого ответа и обработки конфликта параметров.
    criterion: complete
  - id: B24
    topic: Повторные запросы и дублирующиеся события
    applies_when: Требование описывает обмен сообщениями между сервисами, обработку событий процессинга или отправку уведомлений.
    check: Задана ли стратегия повторных попыток и гарантировано ли отсутствие повторного списания, начисления или дублирования уведомлений при повторном получении события?
    typical_gap: Не указано, как система распознаёт и отбрасывает дубли событий от процессинга или платёжного шлюза.
    criterion: complete
  - id: B25
    topic: Порядок событий и доставка не менее одного раза
    applies_when: Требование касается асинхронных очередей, событийной обработки транзакций, статусов или балансов.
    check: Описано ли поведение при поступлении событий с нарушением хронологического порядка (например, клиринг или отмена раньше авторизации) в модели доставки не менее одного раза?
    typical_gap: Логика переходов состояний предполагает строго последовательную и однократную доставку сообщений, что приводит к рассинхронизации статусов.
    criterion: set_complete
  - id: B26
    topic: Таймауты интеграций и неопределённый результат
    applies_when: Требование включает синхронные вызовы внешних или смежных банковских систем.
    check: Заданы ли таймауты взаимодействия и порядок разрешения неопределённого статуса операции при обрыве связи после отправки запроса?
    typical_gap: Отсутствует процедура сверки итогового статуса операции после таймаута, что создаёт риск двойного списания или зависшего статуса.
    criterion: complete
  - id: B27
    topic: Недоступность внешних систем и деградация
    applies_when: Требование зависит от процессинга, платёжных шлюзов, систем оценки рисков, рассылок или справочников.
    check: Определено ли поведение сервиса при недоступности каждой смежной системы — отказ, постановка в очередь, использование кэша или работа в ограниченном режиме?
    typical_gap: Не описаны сценарии деградации и сообщения пользователю при отказе стороннего провайдера или внутреннего сервиса.
    criterion: set_complete
  - id: B28
    topic: Компенсирующие действия и откат
    applies_when: Требование описывает многошаговые операции, затрагивающие несколько счетов, систем или состояний.
    check: Определены ли компенсирующие действия, порядок отката и обработка сбоев самого отката при ошибке на промежуточном шаге операции?
    typical_gap: Не указано, как восстанавливается согласованность данных, если списание прошло, а последующее зачисление или фиксация статуса завершились ошибкой.
    criterion: complete
  - id: B29
    topic: Триггер, получатель и канал уведомления
    applies_when: Требование предусматривает информирование клиента о событиях по карте, счёту, платежу или настройкам.
    check: Однозначно ли заданы событие-триггер, правило определения получателя и приоритет каналов доставки уведомлений?
    typical_gap: Указано лишь требование уведомить клиента, без уточнения, по какому каналу, на какое событие и кому именно отправляется сообщение при нескольких держателях.
    criterion: complete
  - id: B30
    topic: Содержание уведомления, сумма и баланс
    applies_when: Требование описывает тексты или состав данных в финансовых уведомлениях.
    check: Уточнено ли, какие именно реквизиты включаются в уведомление, какая сумма (операции или списания, с комиссией или без) и какой баланс (доступный или фактический) в нём отображаются?
    typical_gap: В шаблоне указаны просто сумма и остаток, без уточнения их валюты, момента расчёта и поведения при отсутствии данных о балансе.
    criterion: unambiguous
  - id: B31
    topic: Маскирование номеров карт и персональных данных
    applies_when: Требование касается уведомлений, экранов интерфейса, чеков, выписок или выгрузок.
    check: Заданы ли правила маскирования номеров карт, счетов и персональных данных в открытых каналах и на экране блокировки устройства?
    typical_gap: Не определено, какие фрагменты реквизитов допустимо показывать в уведомлениях и скрываются ли чувствительные данные на заблокированном экране.
    criterion: complete
  - id: B32
    topic: Локализация и формат данных в уведомлениях
    applies_when: Требование относится к многоязычному обслуживанию, уведомлениям, чекам или сообщениям об ошибках.
    check: Определены ли источник выбора языка клиента, резервный язык и правила форматирования дат, сумм и разделителей для каждой локали?
    typical_gap: Тексты заданы на одном языке без указания источника языковой настройки и поведения при отсутствии перевода.
    criterion: complete
  - id: B33
    topic: Ограничение частоты уведомлений и тихие часы
    applies_when: Требование касается отправки сервисных, информационных или маркетинговых уведомлений.
    check: Заданы ли ограничения частоты отправки, правила агрегации массовых событий и применимость тихих часов с указанием, какие критичные сообщения их обходят?
    typical_gap: Не определено, допустима ли ночная отправка некритичных уведомлений и что происходит с отложенными сообщениями после окончания тихих часов.
    criterion: complete
  - id: B34
    topic: Ошибки доставки и резервные каналы уведомлений
    applies_when: Требование описывает отправку уведомлений через внешние шлюзы доставки.
    check: Описаны ли критерии неуспешной доставки, условия переключения на резервный канал, срок актуальности сообщения и предотвращение дублирования между каналами?
    typical_gap: Не указано, считается ли просроченное уведомление подлежащим повторной отправке и через какой интервал выполняется переключение на резервный канал.
    criterion: complete
  - id: B35
    topic: Управление подписками и обязательные уведомления
    applies_when: Требование включает пользовательские настройки уведомлений или информирование о событиях.
    check: Разделены ли уведомления, от которых клиент может отказаться, и обязательные уведомления безопасности или регуляторного характера, не подлежащие отключению?
    typical_gap: Не определено состояние подписки по умолчанию для новых клиентов и перечень событий, которые доставляются независимо от настроек.
    criterion: set_consistent
  - id: B36
    topic: Защита чувствительных данных в адресах, логах и кэшах
    applies_when: Требование описывает API, журналирование, аналитику, кэширование или передачу данных между сервисами.
    check: Запрещена ли передача платёжных и персональных данных в параметрах адресной строки и определены ли правила их исключения или маскирования в логах, трассировках и кэшах?
    typical_gap: Требования к логированию и диагностике не содержат запрета на запись реквизитов карт, токенов подтверждения и персональных данных.
    criterion: complete
  - id: B37
    topic: Разграничение аутентификации и авторизации
    applies_when: Требование описывает доступ к функциям, подтверждение операций или административные действия.
    check: Разделены ли требования к проверке личности клиента, проверке его полномочий и дополнительному подтверждению критичных операций и изменений настроек?
    typical_gap: Указана только необходимость входа в приложение без определения уровня подтверждения для финансово значимых действий.
    criterion: complete
  - id: B38
    topic: Проверка принадлежности объекта клиенту
    applies_when: Требование касается запросов к данным или действиям по картам, счетам, шаблонам, выпискам и операциям.
    check: Закреплена ли серверная проверка принадлежности запрашиваемой карты, счёта или операции текущему авторизованному клиенту с единым поведением при отказе?
    typical_gap: Проверка прав доступа ограничивается наличием действующей сессии без явного требования проверять владение конкретным ресурсом.
    criterion: complete
  - id: B39
    topic: Аудиторский след критичных действий
    applies_when: Требование описывает финансовые операции, изменение лимитов, статусов, настроек безопасности или прав.
    check: Определены ли перечень аудируемых событий, обязательный состав фиксируемых атрибутов (инициатор, время, канал, старое и новое значение) и защита журнала от изменений?
    typical_gap: Не указано, какие именно изменения настроек и отказы в доступе должны сохраняться для последующего разбора инцидентов.
    criterion: set_complete
  - id: B40
    topic: Фиксация и отзыв согласий клиента
    applies_when: Требование затрагивает подключение услуг, обработку данных, регулярные списания, рассылки или оферты.
    check: Определено ли, как фиксируется факт предоставления согласия, какая версия условий сохраняется и как система реагирует на его отзыв?
    typical_gap: Описано включение функции, но не указаны хранение подтверждения согласия и последствия его отзыва для активных операций и подписок.
    criterion: set_complete
  - id: B41
    topic: Время отклика, точки измерения и процентиль
    applies_when: Требование формулирует ограничения по производительности или скорости обработки операций и уведомлений.
    check: Указаны ли точные начальная и конечная точки измерения задержки, целевой процентиль и условия нагрузки, при которых требование проверяется?
    typical_gap: Указано размытое ожидание быстрого ответа или среднее время без указания процентиля и границ измерения.
    criterion: verifiable
  - id: B42
    topic: Профиль нагрузки и пиковые всплески
    applies_when: Требование относится к платёжным сервисам, рассылкам, массовым начислениям или клиентским API.
    check: Определены ли номинальная и пиковая нагрузка, а также поведение системы при пакетных всплесках (например, массовых начислениях или расчётных периодах)?
    typical_gap: Приведены только среднесуточные объёмы без учёта пиковых нагрузок и стратегии ограничения или буферизации потока.
    criterion: verifiable
  - id: B43
    topic: Доступность и окна обслуживания
    applies_when: Требование касается критичных клиентских и интеграционных банковских сервисов.
    check: Заданы ли измеримый целевой показатель доступности, расчётный период, учёт плановых окон обслуживания и критерии признания сервиса недоступным?
    typical_gap: Требование высокой доступности сформулировано декларативно, без методики расчёта и правил поведения во время регламентных работ.
    criterion: verifiable
  - id: B44
    topic: Сроки хранения, архивирования и удаления данных
    applies_when: Требование описывает хранение транзакций, уведомлений, логов, согласий или пользовательских данных.
    check: Определены ли сроки оперативного и архивного хранения данных, порядок их очистки или обезличивания и влияние удаления на историю клиента?
    typical_gap: Описано создание и накопление данных без указания срока их хранения и правил вывода из оперативной базы.
    criterion: set_complete
  - id: B45
    topic: Состояния пользовательского интерфейса
    applies_when: Требование описывает экраны мобильного или веб-банка, виджеты, списки или формы.
    check: Определены ли все состояния экрана и элементов управления: загрузка, пустой список, частичная ошибка, полная ошибка, недоступное состояние и состояние без сети?
    typical_gap: Зафиксирован только заполненный экран в штатном режиме, без описания пустых состояний, индикаторов загрузки и блокировки недоступных действий.
    criterion: set_complete
  - id: B46
    topic: Валидация ввода и тексты ошибок
    applies_when: Требование описывает формы ввода сумм, реквизитов, лимитов или пользовательских параметров.
    check: Определены ли правила клиентской и серверной валидации, момент её срабатывания и понятные тексты сообщений для каждой бизнес- и технической ошибки?
    typical_gap: Ограничения описаны в общем виде без соответствия конкретным ошибкам и без запрета раскрывать внутренние детали системы в тексте для клиента.
    criterion: complete
  - id: B47
    topic: Источник и актуальность отображаемых данных
    applies_when: Требование описывает отображение балансов, статусов, лимитов, истории операций или тарифов на экране.
    check: Указаны ли источник каждого отображаемого показателя, допустимая задержка его обновления и правила синхронизации при параллельных операциях?
    typical_gap: Интерфейсные требования ссылаются на данные, которых нет в описанном контракте, либо не согласованы с реальной актуальностью баланса и статусов.
    criterion: consistent
  - id: B48
    topic: Граничные значения в критериях приёмки
    applies_when: Требование содержит числовые ограничения, лимиты, сроки, длины полей или диапазоны значений.
    check: Зафиксированы ли проверяемые граничные условия (ниже границы, точно на границе, выше границы) для всех сумм, сроков, лимитов и счётчиков?
    typical_gap: Формулировки содержат нечёткие сравнения без уточнения включительности границ и без критериев проверки пороговых значений.
    criterion: verifiable
  - id: B49
    topic: Негативные сценарии приёмки
    applies_when: Требование задаёт пользовательские истории или критерии приёмки для банковской функциональности.
    check: Покрывают ли критерии приёмки основные негативные сценарии: недостаток средств, превышение лимита, неподходящий статус продукта, отказ внешней системы и неверные права?
    typical_gap: Критерии приёмки описывают исключительно успешное выполнение сценария и не позволяют проверить обработку отказов и ограничений.
    criterion: verifiable
  - id: B50
    topic: Повторные действия пользователя
    applies_when: Требование описывает подтверждение платежей, переводов, изменение настроек или запрос кодов подтверждения.
    check: Определено ли поведение интерфейса и серверной части при двойном нажатии, возврате назад, повторной отправке формы или обрыве связи во время подтверждения?
    typical_gap: Не предусмотрена защита от повторного инициирования операции пользователем и не описано отображение результата уже отправленного запроса.
    criterion: complete
  - id: B51
    topic: Семантика методов API и коды ответов
    applies_when: Требование описывает программные интерфейсы мобильного банка, открытого банкинга или межсервисного взаимодействия.
    check: Определены ли семантика методов (чтение, создание, обновление, идемпотентность), а также исчерпывающий перечень кодов состояния для успешных и ошибочных ответов?
    typical_gap: Контракт описывает только успешный ответ без разграничения ошибок валидации, доступа, конфликта состояний, превышения лимитов и сбоев интеграции.
    criterion: complete
  - id: B52
    topic: Единая схема ошибок API
    applies_when: Требование определяет один или несколько методов API или интеграционных контрактов.
    check: Задана ли единая структура тела ошибки, включая машиночитаемый код бизнес-ошибки, признак допустимости повтора и правила локализации сообщений?
    typical_gap: Разные операции возвращают несогласованные форматы ошибок, из-за чего клиентские приложения вынуждены разбирать текстовые сообщения.
    criterion: set_consistent
  - id: B53
    topic: Версионирование и обратная совместимость API
    applies_when: Требование изменяет существующий программный интерфейс или вводит новый контракт для мобильных клиентов и партнёров.
    check: Определены ли правила версионирования, стратегия обратной совместимости для старых версий клиентских приложений и порядок вывода устаревших версий?
    typical_gap: Изменения в структуре запросов и ответов не учитывают наличие пользователей со старыми версиями мобильного приложения.
    criterion: set_consistent
  - id: B54
    topic: Пагинация, сортировка и фильтрация списков
    applies_when: Требование описывает методы получения истории операций, выписок, уведомлений или списков продуктов.
    check: Заданы ли механизм пагинации, максимальный размер страницы, порядок сортировки по умолчанию и устойчивость выдачи при добавлении новых записей?
    typical_gap: При смещении списка из-за новых транзакций возможны пропуски или дубли записей на стыке страниц, а порядок сортировки совпадающих по времени событий не определён.
    criterion: complete
  - id: B55
    topic: Типы данных, единицы измерения, пустые значения и умолчания
    applies_when: Требование описывает модель данных, параметры настроек, сущности или контракты обмена.
    check: Для каждого атрибута заданы ли точный тип данных, формат, единицы измерения, допустимость пустого значения и значение по умолчанию?
    typical_gap: Не указаны допустимость отсутствия значения, формат денежных сумм и дат, а также поведение при передаче пустого значения вместо исключения параметра.
    criterion: complete
  - id: B56
    topic: Миграция существующих клиентов и данных
    applies_when: Требование вводит новые статусы, лимиты, настройки, поля или меняет бизнес-правила действующего продукта.
    check: Определено ли, какие значения и правила применяются к уже существующим клиентам, активным картам, счетам и незавершённым операциям в момент запуска?
    typical_gap: Описана логика только для новых клиентов или вновь выпущенных продуктов, без плана миграции действующей клиентской базы.
    criterion: set_complete
  - id: B57
    topic: Журналирование для разбора спорных ситуаций
    applies_when: Требование касается финансовых операций, подтверждения действий, расчёта комиссий, курсов или уведомлений.
    check: Определено ли, сохраняется ли достаточный неизменяемый набор фактов о ходе операции, применённом курсе, тарифе и доставке уведомлений для разбора претензий?
    typical_gap: После изменения тарифа или курса невозможно восстановить точные параметры, действовавшие в момент совершения спорной операции.
    criterion: set_complete
  - id: B58
    topic: Согласованность и сохранность данных для отчётности
    applies_when: Требование затрагивает финансовый учёт, корректировки, отмену операций или формирование выгрузок и отчётов.
    check: Обеспечена ли неизменность учётных записей (корректировка через отдельные записи, а не перезапись) и согласованность данных между оперативным контуром и отчётностью?
    typical_gap: Допускается изменение или удаление исторических финансовых записей на месте, что нарушает воспроизводимость выписок и регуляторных отчётов.
    criterion: set_consistent
